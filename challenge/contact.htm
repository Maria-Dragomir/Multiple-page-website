<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOGuidance | Contact</title>
    <link rel="stylesheet" href="./assets/style/style.css">
</head>

<body>

    <header>
        <div class="brand">
            <a href="index.html" class="logo">DOGuidance</a>
            <p>your dog guiding light</p>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="contact.htm">☰ Contact</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>Contact DOGuidance</h1>
            <p>Send a message and take your next guided step.</p>
        </section>

        <section class="contact-section">
            <form>
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="4" required></textarea>

                <button type="submit">Submit</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 DOGuidance. All rights reserved.</p>
    </footer>

</body>

</html>
